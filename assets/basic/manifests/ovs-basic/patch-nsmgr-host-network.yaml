apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nsmgr
spec:
  template:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nsmgr
          command:
            - /bin/sh
            - -ec
          args:
            - |
              advertise_ip="$(
                ip -4 -o addr show scope global \
                  | awk '$4 ~ /^192\.168\.1\./ { sub(/\/.*/, "", $4); print $4; exit }'
              )"
              if [ -z "${advertise_ip}" ]; then
                advertise_ip="${POD_IP}"
              fi
              export NSM_LISTEN_ON="unix:///var/lib/networkservicemesh/nsm.io.sock,tcp://${advertise_ip}:5001"
              echo "nsmgr advertise_ip=${advertise_ip}" >&2
              exec /bin/nsmgr
