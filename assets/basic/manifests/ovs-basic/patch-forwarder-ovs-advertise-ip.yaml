apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: forwarder-ovs
spec:
  template:
    spec:
      containers:
        - name: forwarder-ovs
          command:
            - /bin/sh
            - -ec
          args:
            - |
              tunnel_ip="$(
                ip -4 -o addr show scope global \
                  | awk '$4 ~ /^192\.168\.1\./ { sub(/\/.*/, "", $4); print $4; exit }'
              )"
              if [ -z "${tunnel_ip}" ]; then
                tunnel_ip="${NSM_TUNNEL_IP}"
              fi
              export NSM_TUNNEL_IP="${tunnel_ip}"
              echo "forwarder tunnel_ip=${tunnel_ip}" >&2
              exec /bin/forwarder
