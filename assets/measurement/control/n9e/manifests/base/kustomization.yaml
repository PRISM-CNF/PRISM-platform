apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: n9e-system

resources:
  - 00-namespace.yaml
  - 20-service.yaml
  - 30-pvc.yaml
  - 50-deployment.yaml

configMapGenerator:
  - name: n9e-config
    files:
      - config.toml=../../configs/base/config.toml
      - metrics.yaml=../../configs/base/metrics.yaml
      - ops.yaml=../../configs/base/ops.yaml

generatorOptions:
  disableNameSuffixHash: true
