apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: categraf-system

resources:
  - 00-namespace.yaml
  - 10-serviceaccount-rbac.yaml
  - 50-daemonset.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: categraf-config
    files:
      - config.toml=../../configs/base/config.toml
  - name: categraf-input-cpu
    files:
      - cpu.toml=../../configs/base/inputs/cpu/cpu.toml
  - name: categraf-input-disk
    files:
      - disk.toml=../../configs/base/inputs/disk/disk.toml
  - name: categraf-input-diskio
    files:
      - diskio.toml=../../configs/base/inputs/diskio/diskio.toml
  - name: categraf-input-kubernetes
    files:
      - kubernetes.toml=../../configs/base/inputs/kubernetes/kubernetes.toml
  - name: categraf-input-prometheus
    files:
      - prometheus.toml=../../configs/base/inputs/prometheus/prometheus.toml
  - name: categraf-input-kernel
    files:
      - kernel.toml=../../configs/base/inputs/kernel/kernel.toml
  - name: categraf-input-kernel-vmstat
    files:
      - kernel_vmstat.toml=../../configs/base/inputs/kernel-vmstat/kernel_vmstat.toml
  - name: categraf-input-linux-sysctl-fs
    files:
      - linux_sysctl_fs.toml=../../configs/base/inputs/linux-sysctl-fs/linux_sysctl_fs.toml
  - name: categraf-input-mem
    files:
      - mem.toml=../../configs/base/inputs/mem/mem.toml
  - name: categraf-input-net
    files:
      - net.toml=../../configs/base/inputs/net/net.toml
  - name: categraf-input-netstat
    files:
      - netstat.toml=../../configs/base/inputs/netstat/netstat.toml
  - name: categraf-input-processes
    files:
      - processes.toml=../../configs/base/inputs/processes/processes.toml
  - name: categraf-input-system
    files:
      - system.toml=../../configs/base/inputs/system/system.toml
