apiVersion: v1
kind: ServiceAccount
metadata:
  name: categraf-agent
  namespace: categraf-system
  labels:
    app.kubernetes.io/name: categraf-agent
    app.kubernetes.io/component: system-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: categraf-agent
  labels:
    app.kubernetes.io/name: categraf-agent
    app.kubernetes.io/component: system-collector
rules:
  - apiGroups: [""]
    resources:
      - nodes/metrics
      - nodes/stats
      - nodes/proxy
    verbs:
      - get
  - nonResourceURLs:
      - /metrics
      - /metrics/cadvisor
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: categraf-agent
  labels:
    app.kubernetes.io/name: categraf-agent
    app.kubernetes.io/component: system-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: categraf-agent
subjects:
  - kind: ServiceAccount
    name: categraf-agent
    namespace: categraf-system
