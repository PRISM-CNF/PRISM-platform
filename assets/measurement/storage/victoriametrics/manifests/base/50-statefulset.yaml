apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-metrics
  namespace: victoriametrics-system
  labels:
    app.kubernetes.io/name: victoria-metrics
    app.kubernetes.io/component: single-node
    app.kubernetes.io/part-of: victoriametrics-k8s
spec:
  serviceName: victoria-metrics-internal
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics
      app.kubernetes.io/component: single-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-metrics
        app.kubernetes.io/component: single-node
        app.kubernetes.io/part-of: victoriametrics-k8s
    spec:
      containers:
        - name: victoria-metrics
          image: zihaocnic/victoriametrics-k8s:v1.133.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Shanghai
          args:
            - -httpListenAddr=:8428
            - -storageDataPath=/storage
            - -retentionPeriod=30d
          ports:
            - name: http
              containerPort: 8428
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /storage
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: victoria-metrics
          app.kubernetes.io/component: single-node
          app.kubernetes.io/part-of: victoriametrics-k8s
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

